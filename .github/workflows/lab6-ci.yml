name: Lab 6 CI

on:
  push:
    branches: [lab6-serverless-ci, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lab6/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r lab6/requirements-dev.txt
      - name: Run all Lab 6 tests
        run: python -m pytest lab6/tests -v

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build and verify Lambda ZIP
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path('lab6/lambda_function.py')
          archive = Path('lambda_function.zip')
          with ZipFile(archive, 'w', ZIP_DEFLATED) as package:
              package.write(source, arcname='lambda_function.py')
          with ZipFile(archive) as package:
              assert package.namelist() == ['lambda_function.py']
              assert package.read('lambda_function.py') == source.read_bytes()
              assert package.testzip() is None
          print('ZIP root: lambda_function.py')
          print('SHA-256:', hashlib.sha256(archive.read_bytes()).hexdigest())
          PY
      - name: Upload lambda-package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-package
          path: lambda_function.zip
          archive: true
          if-no-files-found: error
          retention-days: 90
